<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザ登録</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>

    <div class="register-container">
        <div class="register-card">
            <h1>ユーザ登録</h1>
            
            <form th:action="@{/register}" method="post">
                <div class="input-group">
                    <label for="username">ユーザ名（半角英字）</label>
                    <input type="text" id="username" name="username" pattern="[a-zA-Z]+" required>
                </div>
                
                <div class="input-group">
                    <label for="password">パスワード（半角英数字）</label>
                    <input type="password" id="password" name="password" pattern="[a-zA-Z0-9]+" required>
                </div>
                
                <button type="submit" class="btn-register">登録</button>
            </form>

            <div class="link-group">
                <a th:href="@{/login}">ログインはこちら</a>
            </div>
        </div>
    </div>

</body>
</html>

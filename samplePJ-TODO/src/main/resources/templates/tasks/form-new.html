<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク新規作成</title>
    <link rel="stylesheet" th:href="@{/css/task-form.css}">
    <style>
        .error-message { color: red; font-size: 0.9em; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>タスク新規作成</h2>
        
        <form th:action="@{/tasks/save}" th:object="${task}" method="post">
            
            <div class="form-group">
                <label for="title">タイトル</label>
                <input type="text" th:field="*{title}" id="title" placeholder="例：買い物リスト作成">
                <p class="error-message" th:if="${err_title}" th:text="${err_title}"></p>
            </div>

            <div class="form-group">
                <label for="content">内容</label>
                <textarea th:field="*{content}" id="content" placeholder="詳細を入力してください"></textarea>
                <p class="error-message" th:if="${err_content}" th:text="${err_content}"></p>
            </div>

            <div class="form-group">
                <label for="name">登録者</label>
                <input type="text" th:field="*{name}" id="name" placeholder="氏名を入力">
                <p class="error-message" th:if="${err_name}" th:text="${err_name}"></p>
            </div>

            <div class="form-group">
                <label for="startDate">開始日</label>
                <input type="date" th:field="*{startDate}" id="startDate">
                <p class="error-message" th:if="${err_startDate}" th:text="${err_startDate}"></p>
            </div>

            <div class="form-group">
                <label for="endDate">終了日</label>
                <input type="date" th:field="*{endDate}" id="endDate">
                <p class="error-message" th:if="${err_endDate}" th:text="${err_endDate}"></p>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-update">作成</button>
                <a th:href="@{/tasks}" class="btn-cancel">← キャンセル</a>
            </div>
        </form>
    </div>

</body>
</html>
